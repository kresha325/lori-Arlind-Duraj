<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>LORI — Slider TV</title>
    <link rel="icon" href="assets/images/logo.png" />
    <link rel="stylesheet" href="slide.css" />
  </head>
  <body class="slide-fullbleed">
    <div id="fsGate" class="fs-gate">
      <button type="button" id="btnEnterFs" class="fs-gate-btn">Full Screen</button>
    </div>

    <div id="slideApp" class="slide-app">
      <div class="slide-top slide-top-minimal">
        <button type="button" id="btnFullscreen" class="slide-fs-btn">Full Screen</button>
        <a
          id="btnDownloadMp4"
          class="slide-fs-btn slide-dl-btn"
          href="assets/videos/lori-tv-slider.mp4"
          download="LORI-TV-Slider.mp4"
          >Shkarko MP4</a
        >
        <div class="slide-meta">
          <span id="slideCounter">1 / 1</span>
        </div>
      </div>

      <div id="slideStage" class="slide-stage" aria-live="polite">
        <div class="slide-card" id="slideCard">
          <img id="slideImg" class="slide-img" src="" alt="" />
          <div id="slidePriceCard" class="slide-price-card" hidden></div>
        </div>
      </div>

      <div id="downloadToast" class="slide-toast" hidden></div>
    </div>

    <script src="slide.js"></script>
  </body>
</html>
